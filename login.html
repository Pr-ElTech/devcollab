<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Log in | CodeCollab</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page" data-auth="guest">
    <!-- =========================
         AUTH HEADER
    ========================== -->

    <header class="auth-header border-bottom bg-white">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
          <a href="index.html">
            <img
              src="assets/images/logo.png"
              alt="CodeCollab"
              class="auth-logo"
            />
          </a>

          <div class="small text-muted">
            Don't have an account?
            <a
              href="signup.html"
              class="text-primary fw-semibold text-decoration-none"
            >
              Sign up
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- =========================
         LOGIN
    ========================== -->

    <main class="auth-main">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="auth-card">
              <div class="text-center mb-4">
                <div class="auth-icon mx-auto mb-3">
                  <i class="bi bi-code-slash"></i>
                </div>

                <h1 class="h3 fw-bold mb-2">Welcome back</h1>

                <p class="text-muted mb-0">
                  Continue discovering and learning from real projects.
                </p>
              </div>

              <!-- GitHub -->

              <button
                type="button"
                class="btn btn-dark w-100 rounded-3 py-2.5 mb-3"
              >
                <i class="bi bi-github me-2"></i>
                Continue with GitHub
              </button>

              <div class="auth-divider">
                <span>or continue with email</span>
              </div>

              <!-- Form -->

              <form id="loginForm">
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold">
                    Email
                  </label>

                  <input
                    type="email"
                    id="email"
                    class="form-control form-control-lg"
                    placeholder="you@example.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between">
                    <label for="password" class="form-label fw-semibold">
                      Password
                    </label>

                    <a href="#" class="small text-primary text-decoration-none">
                      Forgot password?
                    </a>
                  </div>

                  <div class="position-relative">
                    <input
                      type="password"
                      id="password"
                      class="form-control form-control-lg pe-5"
                      placeholder="Enter your password"
                      required
                    />

                    <button
                      type="button"
                      class="password-toggle"
                      aria-label="Show password"
                    >
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />

                  <label
                    class="form-check-label text-muted small"
                    for="remember"
                  >
                    Remember me
                  </label>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 rounded-3 py-3 fw-semibold"
                >
                  Log in
                </button>
              </form>

              <p class="text-center text-muted small mt-4 mb-0">
                Don't have an account?

                <a
                  href="signup.html"
                  class="text-primary fw-semibold text-decoration-none"
                >
                  Create one
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
