<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Explore | CodeCollab</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CodeCollab CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-auth="required">
    <!-- Shared Header -->
    <div id="app-header"></div>

    <main class="explore-page">
      <!-- =====================================
           EXPLORE HERO
      ====================================== -->

      <section class="py-5">
        <div class="container">
          <div class="row justify-content-center text-center">
            <div class="col-lg-8">
              <span
                class="text-primary fw-semibold text-uppercase small letter-spacing-1"
              >
                Explore
              </span>

              <h1 class="display-5 fw-bold mt-3">
                Find something worth building.
              </h1>

              <p class="text-muted fs-5 mt-3">
                Discover projects, developer posts and people building
                interesting software.
              </p>
            </div>
          </div>

          <!-- SEARCH -->

          <div class="row justify-content-center mt-4">
            <div class="col-lg-7">
              <div class="explore-search">
                <i class="bi bi-search"></i>

                <input
                  type="search"
                  id="exploreSearch"
                  class="form-control"
                  placeholder="Search projects, posts, people or GitHub username..."
                />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- =====================================
           FILTERS
      ====================================== -->

      <section class="pb-4">
        <div class="container">
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <button
              class="explore-filter active"
              type="button"
              data-filter="all"
            >
              All
            </button>

            <button class="explore-filter" type="button" data-filter="projects">
              Projects
            </button>

            <button class="explore-filter" type="button" data-filter="posts">
              Posts
            </button>

            <button class="explore-filter" type="button" data-filter="people">
              People
            </button>
          </div>
        </div>
      </section>

      <!-- =====================================
           RESULTS
      ====================================== -->

      <section class="py-4">
        <div class="container">
          <div id="exploreResults" class="row g-4">
            <!-- Javascript will render results -->
          </div>

          <div id="exploreEmpty" class="text-center py-5 d-none">
            <div class="explore-empty-icon">
              <i class="bi bi-search"></i>
            </div>

            <h3 class="h5 fw-bold mt-3">Nothing found</h3>

            <p class="text-muted">Try another search.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-5">
      <div class="container">
        <div class="text-center text-muted small">
          © 2026 CodeCollab. Discover. Understand. Build.
        </div>
      </div>
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- UI -->
    <script src="js/ui.js"></script>

    <!-- Auth -->
    <script src="js/auth.js"></script>

    <!-- Shared Header -->
    <script src="components/header.js"></script>

    <!-- Explore -->
    <script src="js/explore.js"></script>
  </body>
</html>
