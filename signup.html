<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign up | CodeCollab</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page" data-auth="guest">
    <!-- =========================
         AUTH HEADER
    ========================== -->

    <header class="auth-header border-bottom bg-white">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
          <a href="index.html">
            <img
              src="assets/images/logo.png"
              alt="CodeCollab"
              class="auth-logo"
            />
          </a>

          <div class="small text-muted">
            Already have an account?

            <a
              href="login.html"
              class="text-primary fw-semibold text-decoration-none"
            >
              Log in
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- =========================
         SIGN UP
    ========================== -->

    <main class="auth-main">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-8 col-lg-6">
            <div class="auth-card">
              <div class="text-center mb-4">
                <div class="auth-icon mx-auto mb-3">
                  <i class="bi bi-person-plus"></i>
                </div>

                <h1 class="h3 fw-bold mb-2">Create your account</h1>

                <p class="text-muted mb-0">
                  Join developers discovering, understanding and building.
                </p>
              </div>

              <!-- GitHub -->

              <button
                type="button"
                class="btn btn-dark w-100 rounded-3 py-2 mb-3"
              >
                <i class="bi bi-github me-2"></i>
                Continue with GitHub
              </button>

              <div class="auth-divider">
                <span>or create an account with email</span>
              </div>

              <!-- Form -->

              <form id="signupForm">
                <div class="row g-3">
                  <!-- First Name -->

                  <div class="col-md-6">
                    <label for="firstName" class="form-label fw-semibold">
                      First name
                    </label>

                    <input
                      type="text"
                      id="firstName"
                      class="form-control form-control-lg"
                      placeholder="Promise"
                      required
                    />
                  </div>

                  <!-- Last Name -->

                  <div class="col-md-6">
                    <label for="lastName" class="form-label fw-semibold">
                      Last name
                    </label>

                    <input
                      type="text"
                      id="lastName"
                      class="form-control form-control-lg"
                      placeholder="Elijah"
                      required
                    />
                  </div>

                  <!-- Username -->

                  <div class="col-12">
                    <label for="username" class="form-label fw-semibold">
                      Username
                    </label>

                    <div class="input-group input-group-lg">
                      <span class="input-group-text bg-light border-end-0">
                        @
                      </span>

                      <input
                        type="text"
                        id="username"
                        class="form-control border-start-0"
                        placeholder="yourusername"
                        required
                      />
                    </div>
                  </div>

                  <!-- Email -->

                  <div class="col-12">
                    <label for="email" class="form-label fw-semibold">
                      Email
                    </label>

                    <input
                      type="email"
                      id="email"
                      class="form-control form-control-lg"
                      placeholder="you@example.com"
                      required
                    />
                  </div>

                  <!-- Password -->

                  <div class="col-12">
                    <label for="password" class="form-label fw-semibold">
                      Password
                    </label>

                    <div class="position-relative">
                      <input
                        type="password"
                        id="password"
                        class="form-control form-control-lg pe-5"
                        placeholder="Create a strong password"
                        required
                      />

                      <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                      >
                        <i class="bi bi-eye"></i>
                      </button>
                    </div>
                  </div>

                  <!-- Developer Role -->

                  <div class="col-12">
                    <label for="role" class="form-label fw-semibold">
                      What best describes you?
                    </label>

                    <select id="role" class="form-select form-select-lg">
                      <option selected disabled>Select your role</option>

                      <option>Frontend Developer</option>

                      <option>Backend Developer</option>

                      <option>Full Stack Developer</option>

                      <option>Mobile Developer</option>

                      <option>AI / ML Developer</option>

                      <option>DevOps / Cloud</option>

                      <option>UI / UX Designer</option>

                      <option>Beginner / Learning</option>

                      <option>Other</option>
                    </select>
                  </div>
                </div>

                <!-- Terms -->

                <div class="form-check mt-4 mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms"
                    required
                  />

                  <label class="form-check-label text-muted small" for="terms">
                    I agree to the
                    <a href="#" class="text-primary text-decoration-none">
                      Terms of Service
                    </a>
                    and
                    <a href="#" class="text-primary text-decoration-none">
                      Privacy Policy </a
                    >.
                  </label>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 rounded-3 py-3 fw-semibold"
                >
                  Create Account
                </button>
              </form>

              <p class="text-center text-muted small mt-4 mb-0">
                Already have an account?

                <a
                  href="login.html"
                  class="text-primary fw-semibold text-decoration-none"
                >
                  Log in
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/signup.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
